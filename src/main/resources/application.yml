server:
  port: ${PORT:8081}

spring:
  application:
    name: it.neutro.assist
  main:
    allow-bean-definition-overriding: true
  config:
    import: "optional:classpath:application-local.yml"
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${SMTP_USERNAME:sandeep.ray@decipherzone.com}
    password: ${SMTP_PASSWORD:xckv xwxc zxul ywfa}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${USER_MGMT_DB_URL:jdbc:postgresql://localhost:5432/usermanagement}
    username: ${USER_MGMT_DB_USERNAME:postgres}
    password: ${USER_MGMT_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

groq:
  api-key: ${GROQ_API_KEY:test}

user-management:
  jwt:
    token-validity-ms: 3600000       # 1 hour (default was 20 min)
    refresh-token-validity-ms: 86400000  # 24 hours (default was 1 hour)
  email:
    enabled: ${USER_MANAGEMENT_EMAIL_ENABLED:true}
    from: ${MAIL_FROM:deepakashu28@gmail.com}
    # "brevo" on server (Render free blocks SMTP); "smtp" for local dev
    provider: ${EMAIL_PROVIDER:brevo}
  brevo:
    api-key: ${BREVO_API_KEY:test}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:nutro-assist}
