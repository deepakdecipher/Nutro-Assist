version: "2.4"

services:
  postgres:
    image: postgres:12
    container_name: neutro-forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usermanagement}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:${POSTGRES_CONTAINER_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usermanagement"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: neutro-forge:latest
    container_name: neutro-forge-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/usermanagement}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      SMTP_USERNAME: ${SMTP_USERNAME:-sandeep.ray@decipherzone.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-xckv xwxc zxul ywfa}
      MAIL_FROM: ${MAIL_FROM:-sandeep.ray@decipherzone.com}
      USER_MANAGEMENT_EMAIL_ENABLED: ${USER_MANAGEMENT_EMAIL_ENABLED:-true}

volumes:
  postgres_data:
